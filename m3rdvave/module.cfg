# M-3rd-VAVE: a wavetable polysynth after the 3rd Wave, on the PPG Wave 2.2's wavetables (eng/w3_engine.c;
# eng/w3_tables.h from gen_tables.py and ref/ppg_data.c, Jacajack/avr-ppg ab19d9d, GPL-3.0)
name = M-3RD-VAVE
version = 1
